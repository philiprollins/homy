# Install as /etc/nginx/sites-available/homy and enable the site.
# Homy listens only on 127.0.0.1:8082; Nginx handles public HTTP/S.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homy.pwrarr.com;

    # Reuse the pwrarr.com certificate if it includes *.pwrarr.com.
    ssl_certificate     /etc/letsencrypt/live/pwrarr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwrarr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
